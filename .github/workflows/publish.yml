name: Release ORBIT and publish installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned firmware toolchain
        run: |
          python -m pip install -r requirements.txt
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2
          arduino-cli lib install "GFX Library for Arduino@1.6.3" "XPowersLib@0.3.0"
      - name: Check firmware packaging
        run: python -m unittest discover -s tests -p test_web_firmware.py
      - name: Build firmware and installer
        run: |
          python build.py --web-output web/dist/firmware --web-version "build-${{ github.run_number }}"
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: Check installer in Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Archive the exact published firmware
        run: |
          python -m zipfile -c "orbit-build-${{ github.run_number }}.zip" web/dist/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-firmware
          path: orbit-build-*.zip
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-firmware
      - name: Publish versioned firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          REVISION: ${{ github.sha }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release download "$TAG" --pattern "orbit-$TAG.zip" --dir existing
            python -c '
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as current, zipfile.ZipFile(sys.argv[2]) as previous:
              if set(current.namelist()) != set(previous.namelist()) or any(current.read(p) != previous.read(p) for p in current.namelist()):
                  raise SystemExit("The existing release differs from this rebuild. Start a new workflow run on main instead of overwriting it.")
          ' "orbit-$TAG.zip" "existing/orbit-$TAG.zip"
          else
            gh release create "$TAG" --target "$REVISION" --title "ORBIT $TAG" \
              --generate-notes --latest "orbit-$TAG.zip"
          fi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy installer and matching firmware
        id: deployment
        uses: actions/deploy-pages@v4
